name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: "Run live LLM evaluation (requires LLM_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Offline regression (mock LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run offline tests
        run: python -m pytest tests -q --mock-llm

      - name: Compile check
        run: python -m compileall -q backend/app tests

  live-eval:
    name: Live LLM evaluation (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'glm-4.6v' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run live evaluation
        run: python -m pytest tests/test_agent.py -q --live

      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: tests/live_report.md
          if-no-files-found: warn
