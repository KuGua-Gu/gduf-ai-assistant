services:
  app:
    build: .
    image: gduf-ai-assistant:latest
    container_name: gduf-ai-assistant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_PATH: data/app.db
      OCR_UPLOAD_DIR: data/uploads
    volumes:
      # SQLite、上传的小票都放在这里，重建容器不丢数据
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
